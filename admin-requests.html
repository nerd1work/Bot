<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات - نظام إدارة طلبات المرضى</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>إدارة الطلبات</h1>
        <nav>
            <a href="admin.html">الرئيسية</a>
            <a href="admin-requests.html" class="active">إدارة الطلبات</a>
            <a href="courses.html">إدارة المقررات</a>
            <button onclick="logout()">تسجيل الخروج</button>
        </nav>
    </header>

    <main>
        <section class="admin-requests">
            <h2>إدارة الطلبات</h2>
            
            <div class="approval-info">
                <p>حد الموافقة: يمكنك الموافقة على <strong id="approval-limit">13</strong> طلب في كل مرة</p>
                <p>الفترة الزمنية الحالية: <strong id="time-window">أسبوعية</strong></p>
            </div>
            
            <div class="filters">
                <select id="course-filter">
                    <option value="">جميع المقررات</option>
                    <!-- سيتم ملؤها بواسطة JavaScript -->
                </select>
                <select id="student-filter">
                    <option value="">جميع الطلاب</option>
                    <!-- سيتم ملؤها بواسطة JavaScript -->
                </select>
                <select id="status-filter">
                    <option value="pending">المعلقة فقط</option>
                    <option value="all">جميع الطلبات</option>
                </select>
            </div>
            
            <div class="bulk-actions">
                <button id="select-all-btn">تحديد الكل</button>
                <button id="approve-selected-btn">موافقة على المحدد</button>
                <button id="reject-selected-btn">رفض المحدد</button>
                <span id="selected-count">0 مختار</span>
            </div>
            
            <div id="requests-container" class="requests-container">
                <!-- سيتم ملؤها بواسطة JavaScript -->
            </div>
        </section>
    </main>

    <footer>
        <p>© 2023 نظام إدارة طلبات المرضى. جميع الحقوق محفوظة.</p>
    </footer>

    <script src="auth.js"></script>
    <script src="admin-requests.js"></script>
</body>
</html>
